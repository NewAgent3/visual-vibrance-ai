# Iris entity ID mapping.
# IDs are exposed to shaders through `entityId` in gbuffers and shadow passes.
# Any entity listed here is treated as fully emissive by the shader.
# The optional namespace allows modded entities to be mapped too, e.g.:
#   entity.2 = some_mod:glowing_mob

entity.1 = minecraft:entity_flame

# vanilla fully-emissive entities
entity.2 = minecraft:glow_squid
entity.3 = minecraft:magma_cube
entity.4 = minecraft:blaze
entity.5 = minecraft:glow_item_frame
entity.6 = minecraft:experience_orb
